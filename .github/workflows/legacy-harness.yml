name: Full legacy harness
on:
  workflow_call:
jobs:
  harness:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Run all G1-G56 scenarios and linked unit tests
        run: chmod +x gradlew && bash tools/legacy-harness.sh
      - name: Save complete harness results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: legacy-harness-results
          path: |
            agent-context/harness/build/reports/tests/
            agent-context/harness/build/test-results/
