name: CI

# Pull requests and pushes to work branches only run the tests and build an unsigned release APK, so a change is
# known to compile before it reaches master. Publishing happens in release.yml and must never happen here.
on:
  pull_request:
    branches:
      - master
  push:
    branches-ignore:
      - master
    paths-ignore:
      - '**.md'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      - name: Build release APK (unsigned)
        run: ./gradlew assembleRelease
