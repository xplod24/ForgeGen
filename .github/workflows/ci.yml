name: CI

# Pull requests and pushes to work branches only run the tests and build the APK, so a change is known to compile
# before it reaches master. Publishing happens in release.yml and must never happen here.
on:
  pull_request:
    branches:
      - master
  push:
    branches-ignore:
      - master
    paths-ignore:
      - '**.md'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      - name: Build Debug APK
        # Not debuggable, as published (3.4.0; see app/build.gradle.kts).
        run: ./gradlew assembleDebug -Pforgegen.publish

      - name: Sign with ForgeGen's key
        # As release.yml signs the published APK, so a missing or wrong secret shows before master. Pull
        # requests get no secrets from forks, so only pushes check it.
        if: github.event_name == 'push'
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
        run: bash tools/sign-apk.sh app/build/outputs/apk/debug/app-debug.apk
