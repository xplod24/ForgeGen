name: Vault checks
on:
  workflow_call:
jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test opaque storage and trash expiry
        run: python3 -m unittest discover -s server/remote-vault -v
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - run: chmod +x gradlew
      - name: Production Compose controls and screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          disable-animations: true
          script: ./gradlew connectedDebugAndroidTest && adb pull /sdcard/Android/data/io.github.xplod24.forgegen/files/ui-screenshots ui-screenshots
      - name: Save visual evidence and test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vault-ui-evidence
          path: |
            ui-screenshots/
            app/build/reports/androidTests/
