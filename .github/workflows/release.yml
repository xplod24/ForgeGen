name: Release

# Publishes a release when the version in gradle.properties has not been tagged yet:
# raise VERSION_MAJOR / VERSION_MINOR / VERSION_PATCH, add a "## <version>" section to CHANGELOG.md
# and push to master. The workflow tags the commit "v<major>.<minor>.<patch>" and attaches the release APK
# signed with the release key, which the app's updater then offers. Any other push to master only runs the
# tests and the build.
#
# Needs two repository secrets (Settings > Secrets and variables > Actions):
#   RELEASE_KEYSTORE_BASE64    the release keystore (PKCS12, alias "forgegen"), base64-encoded
#   RELEASE_KEYSTORE_PASSWORD  its password (also the key password)
on:
  push:
    branches:
      - master
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write # create tags and releases

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # all tags, to know which versions are already released

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Determine version
        id: version
        run: |
          NAME=$(./gradlew -q :app:printVersionName | tail -n 1 | tr -d '[:space:]')
          if ! [[ "$NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Could not read the version from gradle.properties (got '$NAME')"
            exit 1
          fi
          TAG="v$NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/$TAG" > /dev/null; then
            echo "$TAG is already released; raise the version in gradle.properties to publish a new one."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          LATEST=$(git tag --list 'v*.*.*' --sort=-v:refname | head -n 1)
          if [[ -n "$LATEST" && "$(printf '%s\n%s\n' "$LATEST" "$TAG" | sort -V | tail -n 1)" != "$TAG" ]]; then
            echo "::error::$TAG is not newer than $LATEST, so the app would never install it"
            exit 1
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"

      - name: Release notes
        if: steps.version.outputs.publish == 'true'
        run: |
          # The "## <version>" section of CHANGELOG.md, up to the next "## " heading.
          awk -v heading="## ${{ steps.version.outputs.name }}" \
            '$0 == heading { found = 1; next } /^## / { if (found) exit } found' CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "::error::CHANGELOG.md needs a '## ${{ steps.version.outputs.name }}' section describing this release"
            exit 1
          fi
          printf '\nBuilt from %s.\n' "$GITHUB_SHA" >> release-notes.md
          cat release-notes.md

      - name: Release key
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
        run: |
          if [[ -z "$KEYSTORE_BASE64" || -z "$KEYSTORE_PASSWORD" ]]; then
            if [[ "${{ steps.version.outputs.publish }}" == "true" ]]; then
              echo "::error::Add the RELEASE_KEYSTORE_BASE64 and RELEASE_KEYSTORE_PASSWORD secrets; a release must be signed with the release key"
              exit 1
            fi
            echo "No release key; building an unsigned APK only to check the build."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.p12"
          echo "RELEASE_KEYSTORE_FILE=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"
          echo "RELEASE_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"

      - name: Run unit tests
        run: ./gradlew testReleaseUnitTest

      - name: Build release APK
        run: ./gradlew assembleRelease

      - name: Check the signature
        if: steps.version.outputs.publish == 'true'
        run: |
          # Phones only update the app from an APK signed with the same key, so never publish another one.
          APK=app/build/outputs/apk/release/app-release.apk
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)
          "$APKSIGNER" verify --print-certs "$APK" | tee signature.txt
          if ! grep -qi "certificate SHA-256 digest: $RELEASE_CERT_SHA256" signature.txt; then
            echo "::error::$APK is not signed with the ForgeGen release key"
            exit 1
          fi
          cp "$APK" "ForgeGen-${{ steps.version.outputs.tag }}.apk"
        env:
          RELEASE_CERT_SHA256: 22c6e6add4c03e59b4a7106a6036f4d8781ef7c7559340f87909d6318261c06d

      - name: Publish release
        if: steps.version.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.version.outputs.tag }}
          body_path: release-notes.md
          files: ForgeGen-${{ steps.version.outputs.tag }}.apk
          make_latest: true
