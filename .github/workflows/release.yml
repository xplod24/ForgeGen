name: Release

# Publishes app-debug.apk as the latest GitHub release; the app's updater installs from there.
#  - every push to master (changes to Markdown files only are skipped),
#  - a pushed tag "build-<versionCode>" releases exactly that commit (from any branch),
#  - or by hand: Actions -> Release -> Run workflow.
on:
  push:
    branches:
      - master
    tags:
      - 'build-*'
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write # create tags and releases

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # versionCode = 1000 + commit count, a shallow clone would give 1001

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Determine version
        id: version
        run: |
          CODE=$(./gradlew -q :app:printVersionCode | tail -n 1 | tr -d '[:space:]')
          if ! [[ "$CODE" =~ ^[0-9]+$ ]]; then
            echo "::error::Could not read versionCode (got '$CODE')"
            exit 1
          fi
          TAG="build-$CODE"
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "$TAG" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match this commit's versionCode; use $TAG"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Release notes
        run: |
          # The first block of CHANGELOG.md (up to the first empty line) describes this release.
          awk 'NF == 0 { exit } { print }' CHANGELOG.md > release-notes.md
          printf '\nBuilt from %s.\n' "$GITHUB_SHA" >> release-notes.md
          cat release-notes.md

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.version.outputs.tag }}
          body_path: release-notes.md
          files: app/build/outputs/apk/debug/app-debug.apk
          make_latest: true
