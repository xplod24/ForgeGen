name: Release

# Publishes a release when the version in gradle.properties has not been tagged yet:
# raise VERSION_MAJOR / VERSION_MINOR / VERSION_PATCH (or VERSION_MICRO for a micro-patch), add a "## <version>"
# section to CHANGELOG.md and push to master. The workflow tags the commit "v<major>.<minor>.<patch>" (a micro-patch:
# "v<major>.<minor>.<patch>-<micro>") and attaches app-debug.apk, which the app's updater then offers.
# Any other push to master only runs the tests and the build.
#
# Since 3.5.1 the published APK is signed with ForgeGen's own key by key rotation from app/debug.keystore, which
# signed the releases up to 3.5.0 (tools/sign-apk.sh). The key comes from the repository secrets
# RELEASE_KEYSTORE_BASE64 and RELEASE_KEYSTORE_PASSWORD; without them, or with wrong ones, nothing is published.
on:
  push:
    branches:
      - master
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write # create tags and releases

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # all tags, to know which versions are already released

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Determine version
        id: version
        run: |
          NAME=$(./gradlew -q :app:printVersionName | tail -n 1 | tr -d '[:space:]')
          if ! [[ "$NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9]+)?$ ]]; then
            echo "::error::Could not read the version from gradle.properties (got '$NAME')"
            exit 1
          fi
          TAG="v$NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/$TAG" > /dev/null; then
            echo "$TAG is already released; raise the version in gradle.properties to publish a new one."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          LATEST=$(git tag --list 'v*.*.*' --sort=-v:refname | head -n 1)
          if [[ -n "$LATEST" && "$(printf '%s\n%s\n' "$LATEST" "$TAG" | sort -V | tail -n 1)" != "$TAG" ]]; then
            echo "::error::$TAG is not newer than $LATEST, so the app would never install it"
            exit 1
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"

      - name: Release notes
        if: steps.version.outputs.publish == 'true'
        run: |
          # The "## <version>" section of CHANGELOG.md, up to the next "## " heading.
          awk -v heading="## ${{ steps.version.outputs.name }}" \
            '$0 == heading { found = 1; next } /^## / { if (found) exit } found' CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "::error::CHANGELOG.md needs a '## ${{ steps.version.outputs.name }}' section describing this release"
            exit 1
          fi
          printf '\nBuilt from %s.\n' "$GITHUB_SHA" >> release-notes.md
          cat release-notes.md

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      - name: Build Debug APK
        # Not debuggable, as published (3.4.0; see app/build.gradle.kts).
        run: ./gradlew assembleDebug -Pforgegen.publish

      - name: Sign with ForgeGen's key
        # Stops the job, before anything is published, when a secret is missing or the signature is not as expected.
        if: steps.version.outputs.publish == 'true'
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
        run: bash tools/sign-apk.sh app/build/outputs/apk/debug/app-debug.apk

      - name: Mapping file
        # R8's mapping of this very build (3.5.0), to read the line numbers of crash logs from the published APK
        # (MEMORY.md, "R8 rules"): about 4 MB zipped. The in-app updater takes the release's .apk and ignores it.
        if: steps.version.outputs.publish == 'true'
        run: cd app/build/outputs/mapping/debug && zip -9 -q "$GITHUB_WORKSPACE/mapping.zip" mapping.txt

      - name: Publish release
        if: steps.version.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.version.outputs.tag }}
          body_path: release-notes.md
          files: |
            app/build/outputs/apk/debug/app-debug.apk
            mapping.zip
          make_latest: true
